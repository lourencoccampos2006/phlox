name: QA diário

# A equipa de agentes de QA. Duas camadas, com custos muito diferentes:
#
#   CAMADA GRATUITA (a maior parte). Puro Node + Playwright, zero tokens:
#     Sentinela ...... estados HTTP, erros de consola, exceções, pedidos falhados
#     Scroll ......... roda do rato em cada rota (nunca scrollTo — ver run.mjs)
#     Transbordo ..... conteúdo mais largo que o ecrã, com o elemento culpado
#     Regressão visual capturas comparadas com as referências do repositório
#     Links .......... visita cada link interno à procura de becos sem saída
#     Acessibilidade . axe-core, só violações graves e críticas
#     Metadados ...... título, descrição, og:image, h1, lang, alt das imagens
#     Segurança ...... HSTS, Referrer-Policy, X-Content-Type-Options (só em produção)
#
#   CAMADA POR SUBSCRIÇÃO (pequena). A claude-code-action olha para as capturas
#   e procura o que nenhuma regra exprime: "isto parece partido a um humano?".
#   Autentica com CLAUDE_CODE_OAUTH_TOKEN — sai da tua subscrição Claude, NÃO
#   de créditos de API.
#
# ── O QUE TENS DE FAZER UMA VEZ ─────────────────────────────────────────────
#   1. INSTALAR A APP DO GITHUB: https://github.com/apps/claude
#      Sem isto a ação recusa-se a correr, mesmo com o token certo — foi o erro
#      "Claude Code is not installed on this repository" da primeira corrida.
#   2. Correr `claude setup-token` no teu computador.
#   3. Guardar o resultado em Definições → Secrets and variables → Actions,
#      com o nome CLAUDE_CODE_OAUTH_TOKEN.
#   4. Correr este workflow à mão com "atualizar_referencias" ligado, uma vez,
#      para criar as referências visuais NO LINUX do CI (as geradas no Windows
#      não servem — o desenho das letras é diferente e daria alarme todos os dias).
#
# Sem o segredo continua a correr: sai a camada gratuita, que já é a que apanha
# as regressões que partem o site.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC — 07:00 em Portugal no verão
  workflow_dispatch:
    inputs:
      atualizar_referencias:
        description: 'Regenerar as referências visuais e commitá-las'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  producao:
    name: Produção (só leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Agentes contra produção
        run: node scripts/qa-agents/run.mjs --base-url https://phloxclinical.com --mode publico --label producao
      - uses: actions/upload-artifact@v5
        if: always()   # sem isto, um job que falha leva os dados com ele
        with: { name: qa-producao, path: qa-out/, retention-days: 14 }

  completo:
    name: Build local (com sessão)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # O `producao` ataca o site já publicado e não precisa de nada. Este constrói
    # a app de raiz, e uma app sem Supabase não é a app: 81 sítios no código
    # fazem createClient(NEXT_PUBLIC_SUPABASE_URL!, ...), que rebenta com
    # "supabaseUrl is required" quando isso vem vazio. E sem sessão não há rotas
    # privadas — que são a única razão de este job existir ao lado do outro.
    #
    # De propósito NÃO passa aqui a SUPABASE_SERVICE_ROLE_KEY: essa chave ignora
    # todo o RLS, e um segredo em Actions fica ao alcance de qualquer workflow do
    # repositório. O QA navega como um utilizador normal — a chave anónima chega.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }

      # Avisa, não parte. Testado em 27/08/2026: o build passa sem estas
      # variáveis — o que falha é o login, e essa falta já sai no relatório como
      # CRÍTICO ("Login da conta de QA falhou … a cobertura de hoje está
      # incompleta"). Vale mais correr as rotas públicas e dizer o que ficou por
      # ver, do que pintar o job de vermelho e não verificar nada.
      - name: Confirmar que os segredos existem
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Sem NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY nos segredos do repositório: o login não vai funcionar e as rotas privadas ficam por verificar. Cria-os em Definições → Secrets and variables → Actions, com os mesmos valores do .env.local (são públicos por natureza — vão no JavaScript do site — mas o CI não os adivinha)."
          else
            echo "segredos presentes"
          fi

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Criar já a pasta: assim o artefacto sobe sempre com alguma coisa, mesmo
      # que tudo rebente a seguir. Sem isto ficámos sem diagnóstico nenhum —
      # "No files were found with the provided path: qa-out/".
      - run: mkdir -p qa-out

      - name: Limpar referências (só quando pedido à mão)
        if: inputs.atualizar_referencias
        run: rm -rf tests/baselines

      - name: Build de produção
        run: npm run build 2>&1 | tee qa-out/build.log

      # TUDO NUM SÓ SHELL. Cada `run:` é um processo separado, por isso um
      # `npm start &` num passo e o `wait-on` noutro deixava o servidor morrer
      # com o shell que o lançou — o wait-on esperava 90s por nada e o job caía
      # antes de os agentes arrancarem.
      - name: Arrancar servidor e correr os agentes
        run: |
          set -o pipefail
          npm start > qa-out/servidor.log 2>&1 &
          SERVIDOR=$!
          echo "servidor no pid $SERVIDOR"

          if ! npx wait-on http://localhost:3000 --timeout 120000; then
            echo "::error::O servidor não subiu em 120s. Registo:"
            tail -60 qa-out/servidor.log
            exit 1
          fi
          echo "servidor de pé"

          node scripts/qa-agents/run.mjs --base-url http://localhost:3000 --mode completo --label completo
          CODIGO=$?

          kill $SERVIDOR 2>/dev/null || true
          exit $CODIGO

      - name: Registo do servidor em caso de falha
        if: failure()
        run: |
          echo "──── últimas 80 linhas do servidor ────"
          tail -80 qa-out/servidor.log || echo "(sem registo)"
          echo "──── últimas 40 do build ────"
          tail -40 qa-out/build.log || echo "(sem registo)"

      - name: Commitar as referências novas
        if: inputs.atualizar_referencias
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/baselines
          git diff --staged --quiet || git commit -m "QA: atualizar referências visuais"
          git push

      - uses: actions/upload-artifact@v5
        if: always()   # sem isto, um job que falha leva os dados com ele
        with: { name: qa-completo, path: qa-out/, retention-days: 14 }

  relatorio:
    name: Relatório
    needs: [producao, completo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }

      - uses: actions/download-artifact@v5
        with: { name: qa-producao, path: qa-out/ }
        continue-on-error: true
      - uses: actions/download-artifact@v5
        with: { name: qa-completo, path: qa-out/ }
        continue-on-error: true

      # Camada gratuita: o relatório determinístico. Corre sempre.
      - name: Escrever o relatório
        run: node scripts/qa-agents/report.mjs

      # O contexto `secrets` não se pode usar à vontade num `if` de passo, por
      # isso passa primeiro por um output.
      - id: token
        run: echo "existe=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Camada por subscrição: revisão visual + abertura do issue.
      - name: Revisão visual e issue
        id: claude
        if: steps.token.outputs.existe == 'true'
        continue-on-error: true   # app por instalar ou quota no limite não pode partir o relatório
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 40 --allowedTools "Read,Glob,Bash(gh issue create:*)"'
          prompt: |
            És o revisor de QA do Phlox, um produto português para centros de dia e lares.
            Escreves sempre em português de Portugal.

            1. Lê `qa-out/report.md` — são os achados determinísticos de hoje.
            2. Olha para as capturas em `qa-out/shots/` (telemóvel 390×844, viewport real).

            Nas capturas procura APENAS defeitos objetivos que um utilizador notaria:
            texto cortado, sobreposto ou ilegível; elementos fora do ecrã; botões
            pequenos demais para tocar; conteúdo que não carregou; erros de português;
            texto de marcador de posição esquecido.

            NÃO assinales gosto pessoal: paletas, tipos de letra, "mais espaço em
            branco", "podia ser mais moderno". Isso não são defeitos.

            Depois:
            - Se o relatório disser "Nada a assinalar" E as capturas estiverem bem,
              não faças nada. Escreve só "Nada a assinalar" e termina. NÃO abras issue.
            - Caso contrário, abre UM issue com:
                gh issue create --title "QA diário — <data de hoje em dd/mm/aaaa>" --body "<corpo>"
              O corpo leva os achados do report.md seguidos dos teus, no máximo 5 no
              total, do mais grave para o menos. Uma frase por achado, concreta.

            Um relatório que grita lobo deixa de ser lido. Na dúvida, não assinales.

      # REDE DE SEGURANÇA. Se o Claude não correu — app do GitHub por instalar,
      # segredo em falta, quota no limite — o relatório determinístico abre o
      # issue sozinho. O QA nunca fica em silêncio por causa da camada de IA.
      - name: Abrir issue sem o Claude
        if: steps.claude.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.token.outputs.existe }}" != "true" ]; then
            echo "::notice::Sem CLAUDE_CODE_OAUTH_TOKEN — correu só a camada gratuita."
          else
            echo "::warning::A revisão visual não terminou bem — ver o passo 'Revisão visual e issue' acima para a razão. Causas comuns: a app https://github.com/apps/claude por instalar, o limite de passos, ou a quota da subscrição."
          fi
          cat qa-out/report.md
          if [ "$(cat qa-out/tem-achados)" = "1" ]; then
            gh issue create \
              --title "QA diário — $(date +%d/%m/%Y)" \
              --body-file qa-out/report.md
          else
            echo "Nada a assinalar — sem issue."
          fi

      # O histórico da tendência tem de sobreviver de um dia para o outro,
      # senão o relatório nunca consegue dizer "isto já cá anda há uma semana".
      - name: Guardar o histórico
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa-history || true
          git diff --staged --quiet || git commit -m "QA: histórico de $(date +%d/%m/%Y)"
          git push || echo "sem push (sem alterações ou sem permissão)"

      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: qa-relatorio, path: qa-out/report.md, retention-days: 30 }
