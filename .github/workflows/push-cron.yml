name: Push Notifications Cron

# ── A BANDA, E PORQUE E QUE E ASSIM ─────────────────────────────────────────
# Este workflow e a RESERVA. O relogio verdadeiro e o pg_cron dentro do
# Supabase (supabase/sprint144_relogio.sql), que corre de 5 em 5 minutos e nao
# depende de runners partilhados.
#
# Media-se o que o GitHub faz mesmo, a 14 de setembro de 2026:
#
#   Push Notifications Cron   agendado 96/dia (*/15)  ->  6 execucoes em 24h
#   Crons do Phlox            agendado  5/dia (diarios) ->  5 execucoes em 24h
#
# O padrao e claro: o GitHub cumpre agendamentos POUCO FREQUENTES e descarta os
# frequentes. E o que eles proprios documentam — o evento `schedule` e atrasado
# em alturas de carga, e um agendamento de 5 em 5 minutos pode ser saltado.
#
# Por isso deixou de haver UM agendamento de 15 em 15 minutos e passou a haver
# SEIS agendamentos horarios desencontrados. Cada um, sozinho, esta na banda que
# o GitHub cumpre; juntos dao uma passagem a cada ~10 minutos. Os minutos nao
# custam nada: em repositorios PUBLICOS os runners normais sao gratuitos e sem
# limite (os 3.000 minutos do plano Pro so contam para repositorios privados).
#
# Evita-se de proposito o minuto :00 — e a hora de maior carga do GitHub e a que
# mais atrasos apanha.
#
# Chamar a mesma rota varias vezes nao faz mal nenhum: cada lembrete e cada
# aviso tem uma etiqueta estavel e so sai uma vez (ver push_notifications_sent).

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
    - cron: '57 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (production/preview)'
        required: false
        default: 'production'

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Phlox push cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://phloxclinical.com' }}
        run: |
          echo "A correr o cron às $(date -u)"

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta o segredo CRON_SECRET. Cria-o em Definições → Secrets and variables → Actions com o MESMO valor que está na Vercel (Settings → Environment Variables → CRON_SECRET). Sem ele o endpoint responde 401 e nenhuma notificação de medicação é enviada."
            exit 1
          fi

          # Sem o -f do curl. Com ele, um 401 fazia o curl sair com o código 22,
          # e como isto é uma atribuição `X=$(...)` sob `bash -e`, o passo morria
          # aqui mesmo — todo o tratamento de erro em baixo nunca corria, e o
          # registo mostrava só "Process completed with exit code 22", sem dizer
          # o que se passou. Agora o estado é capturado e explicado.
          HTTP_STATUS=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" \
            -X GET \
            -H "x-cron-secret: ${CRON_SECRET}" \
            --max-time 25 \
            "${APP_URL}/api/push/cron") || HTTP_STATUS="sem-resposta"

          echo "Estado HTTP: ${HTTP_STATUS}"
          cat /tmp/cron_response.json 2>/dev/null || true
          echo

          case "$HTTP_STATUS" in
            2??) echo "Cron concluído."; exit 0 ;;
            401) echo "::error::401 em ${APP_URL}. O CRON_SECRET do GitHub não coincide com o que está na Vercel. Confirma que são exatamente iguais (sem espaços nem quebras de linha)."; exit 1 ;;
            404) echo "::error::404 em ${APP_URL}/api/push/cron. O endereço está errado — define o segredo APP_URL como https://phloxclinical.com"; exit 1 ;;
            503) echo "::error::503 — o Phlox atendeu mas não consegue trabalhar. A resposta em cima diz o que falta (quase sempre a SUPABASE_SERVICE_ROLE_KEY nas variáveis de ambiente da Vercel). Até 2026-09-13 este caso respondia 200 e este passo ficava VERDE sem enviar nada."; exit 1 ;;
            sem-resposta) echo "::error::O servidor não respondeu em 25s a ${APP_URL}."; exit 1 ;;
            *) echo "::error::Estado inesperado ${HTTP_STATUS} de ${APP_URL}/api/push/cron."; exit 1 ;;
          esac
